[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newscli-tool"
version = "1.1.2"
description = "Unified news aggregation CLI — 9 sources, 25+ modules, natural language DSL, v1.1: --dedup + schema validation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "kzclaw", email = "kzclaw@users.noreply.github.com"}
]
keywords = ["news", "hackernews", "github", "cli", "aggregation", "rss", "dedup", "validation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]

[project.scripts]
newscli = "newscli.cli:main"
newscli-skill-install = "newscli.newscli_skill:install_cmd"
newscli-skill-update = "newscli.newscli_skill:update_cmd"
newscli-skill-check = "newscli.newscli_skill:check_cmd"

[project.urls]
Homepage = "https://github.com/kzclaw/news-cli"
Repository = "https://github.com/kzclaw/news-cli"
Issues = "https://github.com/kzclaw/news-cli/issues"

[tool.setuptools]
packages = ["newscli", "newscli.sources"]

[tool.setuptools.package-data]
newscli = [
    "skill/SKILL.md",
    "skill/news-cli/SKILL.md",
    "skill/metadata.json",
]
