[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newscli"
version = "1.0.0"
description = "Unified news aggregation CLI — 9 sources, 25+ modules, natural language DSL"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "kzclaw", email = "kzclaw@users.noreply.github.com"}
]
keywords = ["news", "hackernews", "github", "cli", "aggregation", "rss"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: News",
]
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]

[project.scripts]
newscli = "newscli.cli:main"

[project.urls]
Homepage = "https://github.com/kzclaw/news-cli"
Repository = "https://github.com/kzclaw/news-cli"
Issues = "https://github.com/kzclaw/news-cli/issues"

[tool.setuptools]
packages = ["newscli", "newscli.sources"]